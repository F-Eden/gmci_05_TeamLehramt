<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<title>Live Dashboard</title>
<style>
  body {
    font-family: Arial, sans-serif;
    font-size: 20px;
    max-width: 700px;
    margin: 1rem auto;
    padding: 1rem;
  }
  h1 {
    text-align: center;
  }
  .question-list {
    margin-top: 2rem;
  }
  .question-item {
    background: #f8f9fa;
    border: 1px solid #ccc;
    border-radius: 6px;
    padding: 1rem;
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  .question-text {
    flex-grow: 1;
  }
  label {
    cursor: pointer;
  }
  #statusMessage {
    margin-top: 1rem;
    font-weight: bold;
  }
  #chatContainer {
    border: 1px solid #ccc;
    height: 250px;
    overflow-y: auto;
    padding: 10px;
    margin-top: 1rem;
    background: #fafafa;
  }
  #chatInput {
    width: 80%;
    padding: 0.5rem;
    font-size: 1rem;
    box-sizing: border-box;
    border-radius: 4px;
    border: 1px solid #ccc;
  }
  #sendChatBtn {
    padding: 0.5rem 1rem;
    font-size: 1rem;
    cursor: pointer;
    background-color: #2980b9;
    color: white;
    border: none;
    border-radius: 4px;
  }
  #sendChatBtn:hover {
    background-color: #2771a3;
  }
  .chat-message {
    padding: 5px 0;
    border-bottom: 1px solid #eee;
  }
  .answer-count {
    background-color: #e8f4f8;
    padding: 0.3rem 0.6rem;
    border-radius: 12px;
    font-size: 0.9rem;
    font-weight: bold;
    margin-left: 10px;
  }
  .stats-container {
    margin-top: 1rem;
    padding: 0.5rem;
    background-color: #f0f8ff;
    border-radius: 6px;
    border-left: 4px solid #2980b9;
  }
  .stat-bar {
    margin: 0.3rem 0;
  }
  .stat-label {
    font-weight: bold;
    margin-right: 0.5rem;
  }
  .stat-bar-fill {
    display: inline-block;
    height: 20px;
    background-color: #3498db;
    border-radius: 3px;
    margin-right: 0.5rem;
    vertical-align: middle;
  }
  .stat-percentage {
    font-size: 0.9rem;
    color: #666;
  }
  .stat-emoji {
    font-size: 1.2rem;
    margin-right: 0.5rem;
  }

  /* Für Textantworten im Dashboard */
  .text-answers {
    margin: 0.6rem 0 0;
    padding-left: 18px;
  }
  .text-answers li {
    margin-bottom: 6px;
    word-break: break-word;
  }
</style>
</head>
<body>

<h1>Live Dashboard</h1>

<div id="sessionTitle"><em>Lädt …</em></div>
<div class="question-list" id="questionList"></div>
<div id="statusMessage"></div>

<!-- Chat -->
<h2>Live Chat</h2>
<div id="chatContainer"></div>
<input type="text" id="chatInput" placeholder="Nachricht schreiben..." />
<button id="sendChatBtn">Senden</button>

<script>
  const chatContainer = document.getElementById('chatContainer');
  const chatInput = document.getElementById('chatInput');
  const sendChatBtn = document.getElementById('sendChatBtn');

  const sessionId = new URLSearchParams(window.location.search).get('id');
  if (!sessionId) alert('Keine Session-ID angegeben!');

  // Chatnachricht hinzufügen
  function addChatMessage(text, fromModerator = false) {
    const msgDiv = document.createElement('div');
    msgDiv.classList.add('chat-message');
    msgDiv.textContent = fromModerator ? `(Moderator) ${text}` : text;
    chatContainer.appendChild(msgDiv);
    chatContainer.scrollTop = chatContainer.scrollHeight;
  }

  // Vorhandene Chatnachrichten laden
  async function loadExistingChats() {
    const mangoQuery = {
      selector: { type: 'chat', sessionId: sessionId },
      sort: [{timestamp: 'asc'}]
    };

    const res = await fetch('http://localhost:5984/gmci/_find', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(mangoQuery)
    });

    const data = await res.json();
    const docs = data && Array.isArray(data.docs) ? data.docs : [];
    docs.forEach(chat => addChatMessage(chat.message, chat.fromModerator));
  }

  // Chatnachricht senden (Moderator)
  async function sendChatMessage() {
    const msg = chatInput.value.trim();
    if (!msg) return alert('Nachricht ist leer');
    const chatDoc = {
      type: 'chat',
      sessionId: sessionId,
      timestamp: new Date().toISOString(),
      fromModerator: true,
      message: msg
    };
    try {
      const res = await fetch('http://localhost:5984/gmci', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(chatDoc)
      });
      if (!res.ok) {
        alert('Fehler beim Senden');
      } else {
        chatInput.value = '';
      }
    } catch(e) {
      alert('Netzwerkfehler');
      console.error(e);
    }
  }

  sendChatBtn.addEventListener('click', sendChatMessage);
  chatInput.addEventListener('keypress', e => {
    if(e.key === 'Enter') {
      e.preventDefault();
      sendChatMessage();
    }
  });

  // Sessionanzeigen, Frage freischalten usw.
  const questionList = document.getElementById('questionList');
  const sessionTitleDiv = document.getElementById('sessionTitle');
  const statusMessage = document.getElementById('statusMessage');

  let sessionDoc = null;
  let questionAnswerCounts = {}; // Speichert Antwortzahlen pro Frage

  // ID aus URL auslesen
  function getSessionId() {
    const params = new URLSearchParams(window.location.search);
    return params.get('id');
  }

  async function loadSession() {
    try {
      const res = await fetch(`http://localhost:5984/gmci/${encodeURIComponent(sessionId)}`);
      if (!res.ok) throw new Error(`Session ${sessionId} nicht gefunden`);
      sessionDoc = await res.json();

      sessionTitleDiv.textContent = `Session: ${sessionDoc.title}`;
      renderQuestions();
    } catch (err) {
      sessionTitleDiv.textContent = 'Fehler beim Laden der Session.';
      console.error(err);
    }
  }

  function isQuestionUnlocked(qId) {
    return Array.isArray(sessionDoc.unlockedQuestions) && sessionDoc.unlockedQuestions.includes(qId);
  }

  async function saveSessionDoc() {
    if (!sessionDoc || !sessionDoc._id) return;
    try {
      if (!sessionDoc._rev) {
        const currentRes = await fetch(`http://localhost:5984/gmci/${encodeURIComponent(sessionDoc._id)}`);
        if (currentRes.ok) {
          const currentDoc = await currentRes.json();
          sessionDoc._rev = currentDoc._rev;
        }
      }

      const res = await fetch(`http://localhost:5984/gmci/${encodeURIComponent(sessionDoc._id)}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(sessionDoc)
      });

      if (!res.ok) {
        const error = await res.json();
        statusMessage.textContent = 'Fehler beim Speichern: ' + (error.reason || res.statusText);
        return false;
      }

      const data = await res.json();
      sessionDoc._rev = data.rev;
      statusMessage.textContent = 'Speicherung erfolgreich ✔';
      setTimeout(() => statusMessage.textContent = '', 3000);

      updateAnswerCounts();
      updateAllStatistics();

      return true;
    } catch (e) {
      statusMessage.textContent = 'Netzwerkfehler beim Speichern';
      console.error(e);
      return false;
    }
  }

  // Escape (für Textausgaben)
  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  // Funktion zum Berechnen der Statistiken
  async function calculateStatistics() {
    if (!sessionDoc || !Array.isArray(sessionDoc.questions)) return;

    try {
      const feedbackQuery = {
        selector: {
          type: 'feedback',
          sessionId: sessionId
        }
      };

      const res = await fetch('http://localhost:5984/gmci/_find', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(feedbackQuery)
      });

      const data = await res.json();
      const feedbackDocs = data && Array.isArray(data.docs) ? data.docs : [];

      const stats = {};

      sessionDoc.questions.forEach(question => {
        stats[question.id] = {
          type: question.type,
          totalAnswers: 0,
          answers: {}
        };

        switch(question.type) {
          case 'stars':
            for (let i = 1; i <= 5; i++) stats[question.id].answers[i] = 0;
            break;

          case 'emoji':
            // WICHTIG: exakt die Emojis, die Studis senden: 😞 😐 😄
            stats[question.id].answers['😞'] = 0;
            stats[question.id].answers['😐'] = 0;
            stats[question.id].answers['😄'] = 0;
            break;

          case 'multiple-choice':
            if (question.options) {
              question.options.forEach(option => {
                stats[question.id].answers[option] = 0;
              });
            }
            break;

          case 'text':
            // Textantworten sammeln wir als Array
            stats[question.id].answers = [];
            break;
        }
      });

      feedbackDocs.forEach(feedback => {
        if (!feedback.answers) return;

        Object.keys(feedback.answers).forEach(questionId => {
          const answer = feedback.answers[questionId];
          if (!stats[questionId]) return;

          stats[questionId].totalAnswers++;

          // TEXT: sammeln statt Balken
          if (stats[questionId].type === 'text') {
            if (typeof answer === 'string' && answer.trim() !== '') {
              stats[questionId].answers.push(answer.trim());
            }
            return;
          }

          // Andere Typen: zählen
          if (stats[questionId].answers && Object.prototype.hasOwnProperty.call(stats[questionId].answers, answer)) {
            stats[questionId].answers[answer]++;
          } else if (stats[questionId].type === 'stars' && !isNaN(answer)) {
            stats[questionId].answers[answer]++;
          }
        });
      });

      return stats;

    } catch (error) {
      console.error('Fehler beim Berechnen der Statistiken:', error);
      return {};
    }
  }

  // Funktion zum Anzeigen der Statistiken
  function displayStatistics(question, stats) {
    const statsContainer = document.getElementById(`stats-${question.id}`);
    if (!statsContainer) return;

    const statData = stats[question.id];
    if (!statData) {
      statsContainer.innerHTML = '<p>Keine Statistiken verfügbar</p>';
      return;
    }

    let html = '';

    switch(statData.type) {
      case 'stars':
        html += '<strong>Sternebewertung:</strong><br>';
        for (let i = 1; i <= 5; i++) {
          const count = statData.answers[i] || 0;
          const percentage = statData.totalAnswers > 0 ? Math.round((count / statData.totalAnswers) * 100) : 0;
          html += `<div class="stat-bar">
            <span>${i}*</span>
            <span class="stat-bar-fill" style="width: ${percentage}%"></span>
            <span class="stat-percentage">${count} (${percentage}%)</span>
          </div>`;
        }
        break;

      case 'emoji':
        html += '<strong>Emoji-Bewertung:</strong><br>';
        ['😞', '😐', '😄'].forEach(emoji => {
          const count = statData.answers[emoji] || 0;
          const percentage = statData.totalAnswers > 0 ? Math.round((count / statData.totalAnswers) * 100) : 0;
          html += `<div class="stat-bar">
            <span class="stat-emoji">${emoji}</span>
            <span class="stat-bar-fill" style="width: ${percentage}%"></span>
            <span class="stat-percentage">${count} (${percentage}%)</span>
          </div>`;
        });
        break;

      case 'multiple-choice':
        html += '<strong>Multiple Choice:</strong><br>';
        if (question.options) {
          question.options.forEach(option => {
            const count = statData.answers[option] || 0;
            const percentage = statData.totalAnswers > 0 ? Math.round((count / statData.totalAnswers) * 100) : 0;
            html += `<div class="stat-bar">
              <span>${escapeHtml(option)}</span>
              <span class="stat-bar-fill" style="width: ${percentage}%"></span>
              <span class="stat-percentage">${count} (${percentage}%)</span>
            </div>`;
          });
        }
        break;

      case 'text':
        html += '<strong>Textantworten:</strong><br>';
        if (!Array.isArray(statData.answers) || statData.answers.length === 0) {
          html += `<div class="stat-bar"><em>Noch keine Textantworten</em></div>`;
        } else {
          const last = statData.answers.slice(-5).reverse();
          html += `<ul class="text-answers">`;
          last.forEach(t => {
            html += `<li>${escapeHtml(t)}</li>`;
          });
          html += `</ul>`;
        }
        break;

      default:
        html += '<em>Keine Anzeige für diesen Fragetyp</em>';
        break;
    }

    statsContainer.innerHTML = html;
  }

  async function updateAllStatistics() {
    if (!sessionDoc || !Array.isArray(sessionDoc.questions)) return;
    const stats = await calculateStatistics();
    sessionDoc.questions.forEach(question => displayStatistics(question, stats));
  }

  function renderQuestions() {
    questionList.innerHTML = '';

    if (!Array.isArray(sessionDoc.questions) || sessionDoc.questions.length === 0) {
      questionList.textContent = 'Keine Fragen vorhanden.';
      return;
    }

    sessionDoc.questions.forEach(question => {
      const div = document.createElement('div');
      div.classList.add('question-item');

      const label = document.createElement('label');
      label.classList.add('question-text');
      label.textContent = question.text;

      const countSpan = document.createElement('span');
      countSpan.id = `answer-count-${question.id}`;
      countSpan.classList.add('answer-count');
      countSpan.textContent = '0 Antworten';

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = isQuestionUnlocked(question.id);
      checkbox.title = 'Frage freischalten/sperren';

      checkbox.addEventListener('change', async () => {
        statusMessage.textContent = 'Speichere Änderung...';
        if (!Array.isArray(sessionDoc.unlockedQuestions)) sessionDoc.unlockedQuestions = [];

        if (checkbox.checked) {
          if (!sessionDoc.unlockedQuestions.includes(question.id)) {
            sessionDoc.unlockedQuestions.push(question.id);
          }
        } else {
          sessionDoc.unlockedQuestions = sessionDoc.unlockedQuestions.filter(id => id !== question.id);
        }

        const success = await saveSessionDoc();
        if (!success) checkbox.checked = !checkbox.checked;
      });

      div.appendChild(label);
      div.appendChild(countSpan);
      div.appendChild(checkbox);

      const statsDiv = document.createElement('div');
      statsDiv.id = `stats-${question.id}`;
      statsDiv.classList.add('stats-container');
      statsDiv.style.marginTop = '1rem';
      statsDiv.innerHTML = '<em>Lade Statistiken...</em>';
      div.appendChild(statsDiv);

      questionList.appendChild(div);
    });

    setTimeout(async () => {
      updateAllStatistics();
      updateAnswerCounts();
    }, 100);
  }

  async function updateAnswerCounts() {
    if (!sessionDoc || !Array.isArray(sessionDoc.questions)) return;

    try {
      const feedbackQuery = {
        selector: {
          type: 'feedback',
          sessionId: sessionId
        }
      };

      const res = await fetch('http://localhost:5984/gmci/_find', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(feedbackQuery)
      });

      const data = await res.json();
      const feedbackDocs = data && Array.isArray(data.docs) ? data.docs : [];

      const counts = {};
      sessionDoc.questions.forEach(q => counts[q.id] = 0);

      feedbackDocs.forEach(feedback => {
        if (feedback.answers) {
          Object.keys(feedback.answers).forEach(questionId => {
            if (counts.hasOwnProperty(questionId)) counts[questionId]++;
          });
        }
      });

      sessionDoc.questions.forEach(question => {
        const el = document.getElementById(`answer-count-${question.id}`);
        if (el) el.textContent = `${counts[question.id]} Antworten`;
      });

      questionAnswerCounts = counts;

    } catch (error) {
      console.error('Fehler beim Zählen der Antworten:', error);
    }
  }

  function setupLiveFeedbackUpdates() {
    const source = new EventSource(`http://localhost:5984/gmci/_changes?feed=eventsource&since=now&include_docs=true`);
    source.onmessage = event => {
      const change = JSON.parse(event.data);
      const doc = change.doc;

      if (doc && doc.type === 'feedback' && doc.sessionId === sessionId) {
        updateAnswerCounts();
        updateAllStatistics();
      }

      if (doc && doc.type === 'chat' && doc.sessionId === sessionId) {
        addChatMessage(doc.message, !!doc.fromModerator);
      }
    };
  }

  window.onload = () => {
    loadExistingChats();
    loadSession();
    setupLiveFeedbackUpdates();
  };
</script>

</body>
</html>
