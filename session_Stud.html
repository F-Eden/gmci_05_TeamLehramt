<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Session Feedback</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      font-size: 20px;
      max-width: 600px;
      margin: 2rem auto;
      padding: 1rem;
    }
    h1 { text-align: center; }

    .question {
      background: #f4f6f7;
      border-radius: 10px;
      padding: 1.2rem;
      margin-bottom: 1.2rem;
    }

    .question > label {
      display: block;
      font-weight: bold;
      margin-bottom: 0.8rem;
    }

    textarea {
      width: 100%;
      height: 90px;
      box-sizing: border-box;
      resize: vertical;
      padding: 0.6rem;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    select {
      width: 100%;
      padding: 0.6rem;
      border-radius: 6px;
      border: 1px solid #ccc;
      background: #fff;
    }

    .submit-btn {
      background-color: #27ae60;
      color: white;
      border: none;
      padding: 0.8rem 2.2rem;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
      display: block;
      margin: 1.5rem auto;
    }
    .submit-btn:hover { background-color: #219150; }

    .message {
      text-align: center;
      font-weight: bold;
      margin-top: 1rem;
      color: green;
    }
    .hidden { display: none; }

    /* ---------- Sterne (interaktiv) ---------- */
    .star-rating {
      display: flex;
      gap: 6px;
      margin-top: 0.6rem;
      align-items: center;
    }
    .star {
      font-size: 2.2rem;
      cursor: pointer;
      transition: transform 0.15s;
      color: #ddd;
      user-select: none;
    }
    .star:hover { transform: scale(1.15); }
    .star.filled { color: #f1c40f; }

    /* ---------- Emoji-Kacheln (ganze Box klickbar) ---------- */
    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-top: 0.8rem;
    }
    .emoji-radio {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
    .emoji-tile {
      border: 2px solid #e0e0e0;
      border-radius: 18px;
      background: #ffffff;
      padding: 26px 14px;
      min-height: 150px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;

      cursor: pointer;
      user-select: none;

      transition: transform 0.15s ease,
                  border-color 0.15s ease,
                  box-shadow 0.15s ease,
                  background-color 0.15s ease;
    }
    .emoji-tile:hover {
      transform: translateY(-3px);
      border-color: #bcdcff;
      background: #fbfdff;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }
    .emoji-icon {
      font-size: 3.6rem;
      line-height: 1;
      margin-bottom: 14px;
    }
    .emoji-text {
      font-size: 1.1rem;
      font-weight: 600;
      color: #444;
    }
    .emoji-radio:checked + .emoji-tile {
      border-color: #2980b9;
      background: #f2f8ff;
      box-shadow: 0 0 0 4px rgba(41,128,185,0.2);
    }

    /* ---------- Chat ---------- */
    #chatContainer {
      border: 1px solid #ccc;
      height: 250px;
      overflow-y: auto;
      padding: 10px;
      margin-top: 1rem;
      background: #fafafa;
    }
    #chatInput {
      width: 78%;
      padding: 0.5rem;
      font-size: 1rem;
      box-sizing: border-box;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    #sendChatBtn {
      padding: 0.5rem 1rem;
      font-size: 1rem;
      cursor: pointer;
      background-color: #2980b9;
      color: white;
      border: none;
      border-radius: 4px;
      margin-left: 5px;
    }
    #sendChatBtn:hover { background-color: #2771a3; }
    .chat-message { padding: 5px 0; border-bottom: 1px solid #eee; }
  </style>
</head>
<body>

  <h1>Feedback zur Session</h1>

  <form id="feedbackForm">
    <div id="questionsContainer"></div>
    <button type="submit" class="submit-btn">Feedback abschicken</button>
  </form>

  <div id="message" class="message hidden"></div>

  <h2>Live Chat</h2>
  <div id="chatContainer"></div>
  <input type="text" id="chatInput" placeholder="Frage stellen..." />
  <button id="sendChatBtn">Senden</button>

  <script>
    let isUserTyping = false;
    const form = document.getElementById('feedbackForm');
    const messageDiv = document.getElementById('message');
    let sessionChangesSource = null;

    function getSessionId() {
      const params = new URLSearchParams(window.location.search);
      return params.get('id');
    }

    async function loadSession(sessionId) {
      const res = await fetch(`http://localhost:5984/gmci/${encodeURIComponent(sessionId)}`);
      if (!res.ok) throw new Error('Session nicht gefunden');
      return await res.json();
    }

    function createQuestionInput(question, qIndex) {
      const container = document.createElement('div');
      container.classList.add('question');

      const label = document.createElement('label');
      label.textContent = question.text;
      container.appendChild(label);

      let input;

      if (question.type === 'stars') {
        input = document.createElement('div');

        const starContainer = document.createElement('div');
        starContainer.classList.add('star-rating');

        const hiddenInput = document.createElement('input');
        hiddenInput.type = 'hidden';
        hiddenInput.name = `q-${qIndex}`;
        hiddenInput.id = `q-${qIndex}-hidden`;
        hiddenInput.required = true;

        const stars = [];
        for (let i = 1; i <= 5; i++) {
          const star = document.createElement('span');
          star.classList.add('star');
          star.textContent = '★';
          star.dataset.value = i;

          star.addEventListener('click', () => {
            stars.forEach((s, idx) => {
              if (idx < i) s.classList.add('filled');
              else s.classList.remove('filled');
            });
            hiddenInput.value = String(i);
          });

          stars.push(star);
          starContainer.appendChild(star);
        }

        input.appendChild(hiddenInput);
        input.appendChild(starContainer);

      } else if (question.type === 'emoji') {
        input = document.createElement('div');
        input.classList.add('emoji-grid');

        const emojiOptions = [
          { value: '😞', label: 'Schlecht' },
          { value: '😐', label: 'Neutral' },
          { value: '😄', label: 'Gut' }
        ];

        emojiOptions.forEach((opt, idx) => {
          const radioId = `q-${qIndex}-${idx}`;

          const radio = document.createElement('input');
          radio.type = 'radio';
          radio.id = radioId;
          radio.name = `q-${qIndex}`;
          radio.value = opt.value;
          radio.required = true;
          radio.classList.add('emoji-radio');

          const tile = document.createElement('label');
          tile.htmlFor = radioId;
          tile.classList.add('emoji-tile');

          const emojiSpan = document.createElement('div');
          emojiSpan.classList.add('emoji-icon');
          emojiSpan.textContent = opt.value;

          const textSpan = document.createElement('div');
          textSpan.classList.add('emoji-text');
          textSpan.textContent = opt.label;

          tile.appendChild(emojiSpan);
          tile.appendChild(textSpan);

          input.appendChild(radio);
          input.appendChild(tile);
        });

      } else if (question.type === 'multiple-choice') {
        input = document.createElement('select');
        input.name = `q-${qIndex}`;
        input.required = true;

        const placeholder = document.createElement('option');
        placeholder.value = '';
        placeholder.textContent = 'Bitte wählen...';
        placeholder.disabled = true;
        placeholder.selected = true;
        input.appendChild(placeholder);

        if (Array.isArray(question.options)) {
          question.options.forEach(opt => {
            const o = document.createElement('option');
            o.value = opt;
            o.textContent = opt;
            input.appendChild(o);
          });
        }

      } else if (question.type === 'text') {
        input = document.createElement('textarea');
        input.name = `q-${qIndex}`;
        input.placeholder = 'Deine Antwort...';
        input.required = true;
      } else {
        input = document.createElement('input');
        input.type = 'text';
        input.name = `q-${qIndex}`;
        input.required = true;
      }

      container.appendChild(input);
      return container;
    }

    async function refresh() {
      if (isUserTyping) return;

      const sessionId = getSessionId();
      if (!sessionId) return;

      try {
        const session = await loadSession(sessionId);
        const questionsContainer = document.getElementById('questionsContainer');
        questionsContainer.innerHTML = '';

        const unlockedIds = Array.isArray(session.unlockedQuestions) ? session.unlockedQuestions : [];

        if (!Array.isArray(session.questions) || session.questions.length === 0) {
          questionsContainer.innerHTML = '<p>Zurzeit sind keine Fragen zum Feedback verfügbar.</p>';
          document.querySelector('button[type=submit]').disabled = true;
          return;
        }

        let hasUnlockedQuestions = false;

        session.questions.forEach((q, i) => {
          if (unlockedIds.includes(q.id)) {
            questionsContainer.appendChild(createQuestionInput(q, i));
            hasUnlockedQuestions = true;
          }
        });

        if (!hasUnlockedQuestions && session.questions.length > 0) {
          questionsContainer.innerHTML = '<p>Zurzeit sind keine Fragen zum Feedback freigegeben.</p>';
          document.querySelector('button[type=submit]').disabled = true;
        } else {
          document.querySelector('button[type=submit]').disabled = false;
        }

      } catch (error) {
        console.error("Fehler beim Aktualisieren: ", error);
      }
    }

    function setupSessionLiveUpdates() {
      const sessionId = getSessionId();
      if (!sessionId) return;

      if (sessionChangesSource) sessionChangesSource.close();

      sessionChangesSource = new EventSource(`http://localhost:5984/gmci/_changes?feed=eventsource&since=now&include_docs=true`);

      sessionChangesSource.onmessage = event => {
        const change = JSON.parse(event.data);
        const doc = change.doc;

        if (doc && doc.type === 'session' && doc._id === sessionId) {
          refresh();
        }
      };

      sessionChangesSource.onerror = () => {
        setTimeout(setupSessionLiveUpdates, 5000);
      };
    }

    form.addEventListener('submit', async function(e) {
      e.preventDefault();

      const sessionId = getSessionId();
      if (!sessionId) return;

      const formData = new FormData(form);

      try {
        const session = await loadSession(sessionId);

        const questionIdMap = {};
        session.questions.forEach((question, index) => {
          questionIdMap[`q-${index}`] = question.id;
        });

        const answers = {};
        for (const [key, value] of formData.entries()) {
          if (key.startsWith('q-')) {
            const realQuestionId = questionIdMap[key];
            if (realQuestionId) answers[realQuestionId] = value;
          }
        }

        const feedbackDoc = {
          type: 'feedback',
          sessionId,
          timestamp: new Date().toISOString(),
          answers
        };

        const response = await fetch('http://localhost:5984/gmci', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(feedbackDoc)
        });

        if (!response.ok) {
          const errorData = await response.json();
          alert('Fehler beim Absenden des Feedbacks: ' + (errorData.reason || response.statusText));
          return;
        }

        messageDiv.textContent = 'Danke für dein Feedback!';
        messageDiv.classList.remove('hidden');
        form.reset();
        refresh();

        setTimeout(() => messageDiv.classList.add('hidden'), 2000);

      } catch (err) {
        alert('Fehler bei der Verbindung: ' + err.message);
      }
    });

    /* ---------- Chat ---------- */
    const chatContainerStud = document.getElementById('chatContainer');
    const chatInputStud = document.getElementById('chatInput');
    const sendChatBtn = document.getElementById('sendChatBtn');

    function addChatMessageStud(text, fromModerator = false) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('chat-message');
      msgDiv.textContent = fromModerator ? `(Moderator) ${text}` : text;
      chatContainerStud.appendChild(msgDiv);
      chatContainerStud.scrollTop = chatContainerStud.scrollHeight;
    }

    async function loadChatsStud() {
      const mangoQuery = {
        selector: { type: 'chat', sessionId: getSessionId() },
        sort: [{timestamp: 'asc'}]
      };

      const res = await fetch('http://localhost:5984/gmci/_find', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(mangoQuery)
      });
      const data = await res.json();
      (data.docs || []).forEach(chat => addChatMessageStud(chat.message, chat.fromModerator));
    }

    const sourceStud = new EventSource(`http://localhost:5984/gmci/_changes?feed=eventsource&since=now&include_docs=true`);
    sourceStud.onmessage = event => {
      const change = JSON.parse(event.data);
      const doc = change.doc;
      if (doc && doc.type === 'chat' && doc.sessionId === getSessionId()) {
        addChatMessageStud(doc.message, !!doc.fromModerator);
      }
    };

    async function sendUserMessage() {
      const message = chatInputStud.value.trim();
      if (!message) return;

      const chatDoc = {
        type: 'chat',
        sessionId: getSessionId(),
        timestamp: new Date().toISOString(),
        fromModerator: false,
        message
      };

      const res = await fetch('http://localhost:5984/gmci', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(chatDoc)
      });

      if (!res.ok) alert('Fehler beim Senden der Nachricht!');
      else chatInputStud.value = '';
    }

    sendChatBtn.addEventListener('click', sendUserMessage);
    chatInputStud.addEventListener('keypress', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        sendUserMessage();
      }
    });

    window.onload = () => {
      refresh();
      loadChatsStud();
      setupSessionLiveUpdates();
    };
  </script>
</body>
</html>
