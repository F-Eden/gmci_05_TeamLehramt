<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Sessions Übersicht</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      font-size: 20px;
      display: flex;
      height: 100vh;
    }
    nav {
      width: 150px;
      background-color: #2c3e50;
      border-right: 1px solid #34495e;
      padding: 1rem;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }
    nav a {
      display: block;
      padding: 0.75rem 1rem;
      margin-bottom: 0.5rem;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      transition: background-color 0.3s;
    }
    nav a:hover {
      background-color: #34495e;
    }
    nav a.active {
      background-color: #f1c40f;
      font-weight: bold;
      color: black;
    }
    main {
      flex-grow: 1;
      padding: 1.5rem;
      box-sizing: border-box;
      background-color: #fff;
      overflow-y: auto;
    }
    h1 {
      margin-top: 0;
      margin-bottom: 1rem;
    }
    .btn-new-session {
      display: inline-block;
      background-color: #27ae60;
      color: white;
      padding: 1rem 2rem;
      font-size: 1.2rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 1.5rem;
    }
    .session-list {
      border-radius: 8px;
      box-shadow: 0 0 8px rgba(0,0,0,0.1);
      max-height: 75vh;
      overflow-y: auto;
      background: #ecf0f1;
      padding: 1rem;
    }
    .session-item {
      background: white;
      padding: 0.7rem 1rem;
      margin-bottom: 0.5rem;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: default;
      transition: background-color 0.3s;
      user-select: none;
    }
    .session-item:hover {
      background-color: #dcedc8;
    }
    .icons {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .icon-button {
      font-size: 1.3rem;
      cursor: pointer;
      user-select: none;
      color: #34495e;
      padding: 5px;
      border-radius: 6px;
      transition: background-color 0.2s, color 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
    }
    .icon-button:hover {
      background-color: #bdc3c7;
      color: #2c3e50;
    }

    /* Bunte Buttons (pro Aktion) */
    .icon-copy { color: #2980b9; }
    .icon-copy:hover { background-color: #d6eaf8; color: #1f5f8a; }

    .icon-edit { color: #8e44ad; }
    .icon-edit:hover { background-color: #ebdef0; color: #6c3483; }

    .icon-play { color: #27ae60; }
    .icon-play:hover { background-color: #d5f5e3; color: #1e8449; }

    .icon-stats { color: #e67e22; }
    .icon-stats:hover { background-color: #fae5d3; color: #b95d11; }

    .icon-qr { color: #16a085; }
    .icon-qr:hover { background-color: #d1f2eb; color: #117a65; }

    .icon-delete { color: #c0392b; }
    .icon-delete:hover { background-color: #f2d7d5; color: #922b21; }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">Startseite</a>
    <a href="sessions.html" class="active">Sessions</a>
    <a href="auswertung.html">Auswertung</a>
    <a href="profil.html">Profil</a>
  </nav>

  <main>
    <h1>Alle Feedback Sessions</h1>
    <button class="btn-new-session" onclick="window.location.href='newSession.html'">Eine neue Feedback Session erstellen</button>

    <div class="session-list" id="sessionList">
      <p>Lädt Sessions...</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
  <script>
    const couchUrl = 'http://localhost:5984/gmci/_find';
    const sessionList = document.getElementById('sessionList');

    // QR-Code herunterladen Funktion
    function downloadQRCode(data, fileName = 'qrcode.png') {
      const tempCanvas = document.createElement('canvas');
      QRCode.toCanvas(tempCanvas, data, {width: 200}, function (error) {
        if (error) {
          alert('QR-Code Generierung fehlgeschlagen.');
          console.error(error);
          return;
        }
        tempCanvas.toBlob(function (blob) {
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = fileName;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          URL.revokeObjectURL(link.href);
        });
      });
    }

    // Funktion zum Kopieren einer Session
    async function copySession(sessionId, sessionTitle) {
      try {
        // Session laden
        const sessionRes = await fetch(`http://localhost:5984/gmci/${encodeURIComponent(sessionId)}`);
        const session = await sessionRes.json();
        
        // Neuen Namen abfragen
        const newName = prompt('Gib einen neuen Namen für die kopierte Session ein:', `${sessionTitle} (Kopie)`);
        if (!newName) return;
        
        // Slugify den Namen für die ID
        const slugify = (text) => {
          return text.toString().toLowerCase()
            .trim()
            .replace(/\s+/g, '-')      
            .replace(/[^\w\-]+/g, '')  
            .replace(/\-\-+/g, '-');   
        };
        
        const newId = slugify(newName);
        
        // Prüfen, ob Session mit neuem Namen bereits existiert
        const headResponse = await fetch(`http://localhost:5984/gmci/${encodeURIComponent(newId)}`, { method: 'HEAD' });
        if (headResponse.ok) {
          alert('Ein Session mit diesem Namen existiert bereits! Bitte wähle einen anderen Namen.');
          return;
        }
        
        // Session kopieren (ohne Feedbacks und Chat-Nachrichten)
        const newSession = {
          _id: newId,
          type: 'session',
          title: newName,
          questions: session.questions,
          createdAt: new Date().toISOString()
        };
        
        // Session speichern
        const putResponse = await fetch(`http://localhost:5984/gmci/${encodeURIComponent(newId)}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(newSession)
        });
        
        if (putResponse.ok) {
          alert('Session erfolgreich kopiert!');
          loadSessions(); // Aktualisiere die Liste
        } else {
          const errorData = await putResponse.json();
          alert('Fehler beim Kopieren: ' + (errorData.reason || putResponse.statusText));
        }
      } catch (err) {
        alert('Fehler beim Kopieren der Session: ' + err.message);
      }
    }

    async function loadSessions() {
      try {
        const response = await fetch('http://localhost:5984/gmci/_all_docs?include_docs=true');
        const data = await response.json();
        
        const sessions = data.rows
          .filter(row => row.doc && row.doc.type === "session")
          .sort((a, b) => new Date(b.doc.createdAt) - new Date(a.doc.createdAt))
          .map(row => row.doc);

        if (sessions.length === 0) {
          sessionList.innerHTML = '<p>Keine Sessions gefunden.</p>';
          return;
        }

        sessionList.innerHTML = '';

        sessions.forEach(session => {
          const div = document.createElement('div');
          div.classList.add('session-item');

          const titleSpan = document.createElement('span');
          titleSpan.textContent = session.title + " (" + new Date(session.createdAt).toLocaleDateString() + ")";
          titleSpan.style.flex = '1';
          titleSpan.style.userSelect = 'none';

          // Klick auf Titel = Bearbeiten
          titleSpan.style.cursor = 'pointer';
          titleSpan.title = 'Session bearbeiten';
          titleSpan.addEventListener('click', () => {
            window.location.href = `editSession.html?id=${encodeURIComponent(session._id)}`;
          });

          // Icons container
          const iconsDiv = document.createElement('div');
          iconsDiv.classList.add('icons');

          // Kopier-Icon (klassisch: 2 überlappende Blätter)
          const copyIcon = document.createElement('span');
          copyIcon.classList.add('icon-button', 'icon-copy');
          copyIcon.title = 'Session kopieren';
          copyIcon.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg"
                 width="18" height="18" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          `;
          copyIcon.addEventListener('click', (e) => {
            e.stopPropagation();
            copySession(session._id, session.title);
          });

          // Bearbeiten-Icon (Pencil)
          const editIcon = document.createElement('span');
          editIcon.classList.add('icon-button', 'icon-edit');
          editIcon.title = 'Session bearbeiten';
          editIcon.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg"
                 width="18" height="18" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true">
              <path d="M12 20h9"></path>
              <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
            </svg>
          `;
          editIcon.addEventListener('click', (e) => {
            e.stopPropagation();
            window.location.href = `editSession.html?id=${encodeURIComponent(session._id)}`;
          });

          // Start-Icon (Play circle) + grün
          const playIcon = document.createElement('span');
          playIcon.classList.add('icon-button', 'icon-play');
          playIcon.title = 'Feedbackrunde starten';
          playIcon.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg"
                 width="18" height="18" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true">
              <circle cx="12" cy="12" r="10"></circle>
              <polygon points="10,8 16,12 10,16"></polygon>
            </svg>
          `;
          playIcon.addEventListener('click', (e) => {
            e.stopPropagation();
            const sessionIdEncoded = encodeURIComponent(session._id);
            window.open(`liveDashboard.html?id=${sessionIdEncoded}`, '_blank');
            window.open(`session_Stud.html?id=${sessionIdEncoded}`, '_blank');
          });

          // Auswertungs-Icon (Line chart: verständlicher als 3 Balken)
          const statsIcon = document.createElement('span');
          statsIcon.classList.add('icon-button', 'icon-stats');
          statsIcon.title = 'Auswertung anzeigen';
          statsIcon.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg"
                 width="18" height="18" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true">
              <path d="M3 3v18h18"></path>
              <path d="M7 14l3-3 4 4 6-6"></path>
              <circle cx="7" cy="14" r="1"></circle>
              <circle cx="10" cy="11" r="1"></circle>
              <circle cx="14" cy="15" r="1"></circle>
              <circle cx="20" cy="9" r="1"></circle>
            </svg>
          `;
          statsIcon.addEventListener('click', e => {
            e.stopPropagation();
            window.location.href = `auswertung.html?id=${encodeURIComponent(session._id)}`;
          });

          // QR-Icon (echtes QR-Symbol, typisches Look-and-feel)
          const qrIcon = document.createElement('span');
          qrIcon.classList.add('icon-button', 'icon-qr');
          qrIcon.title = 'QR-Code generieren und herunterladen';
          qrIcon.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg"
                 width="18" height="18" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true">
              <!-- Finder patterns -->
              <rect x="3" y="3" width="8" height="8" rx="1"></rect>
              <rect x="13" y="3" width="8" height="8" rx="1"></rect>
              <rect x="3" y="13" width="8" height="8" rx="1"></rect>
              <rect x="6" y="6" width="2" height="2" fill="currentColor" stroke="none"></rect>
              <rect x="16" y="6" width="2" height="2" fill="currentColor" stroke="none"></rect>
              <rect x="6" y="16" width="2" height="2" fill="currentColor" stroke="none"></rect>

              <!-- Data modules (stylized) -->
              <rect x="13" y="13" width="2" height="2" fill="currentColor" stroke="none"></rect>
              <rect x="17" y="13" width="2" height="2" fill="currentColor" stroke="none"></rect>
              <rect x="15" y="15" width="2" height="2" fill="currentColor" stroke="none"></rect>
              <rect x="13" y="17" width="2" height="2" fill="currentColor" stroke="none"></rect>
              <rect x="19" y="17" width="2" height="2" fill="currentColor" stroke="none"></rect>
              <rect x="17" y="19" width="2" height="2" fill="currentColor" stroke="none"></rect>
            </svg>
          `;
          qrIcon.addEventListener('click', e => {
            e.stopPropagation();
            const url = `https://deineuniseite.edu/session/${encodeURIComponent(session._id)}`;
            downloadQRCode(url, `${session.title}_qrcode.png`);
          });

          // Löschen-Icon (Trash)
          const deleteIcon = document.createElement('span');
          deleteIcon.classList.add('icon-button', 'icon-delete');
          deleteIcon.title = 'Session löschen';
          deleteIcon.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg"
                 width="18" height="18" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
              <path d="M10 11v6"></path>
              <path d="M14 11v6"></path>
              <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
            </svg>
          `;
          deleteIcon.addEventListener('click', async e => {
            e.stopPropagation();
            if (confirm(`Möchtest du die Session "${session.title}" wirklich löschen? Dies löscht auch alle zugehörigen Feedbacks und Chat-Nachrichten!`)) {
              try {
                await deleteSessionWithRelatedData(session._id);
                alert('Session und alle zugehörigen Daten gelöscht!');
                loadSessions();
              } catch (err) {
                alert('Fehler beim Löschen: ' + err.message);
              }
            }
          });

          // Icons hinzufügen in Reihenfolge: Copy - Edit - Play - Stats - QR - Müll
          iconsDiv.appendChild(copyIcon);
          iconsDiv.appendChild(editIcon);
          iconsDiv.appendChild(playIcon);
          iconsDiv.appendChild(statsIcon);
          iconsDiv.appendChild(qrIcon);
          iconsDiv.appendChild(deleteIcon);

          div.appendChild(titleSpan);
          div.appendChild(iconsDiv);
          sessionList.appendChild(div);
        });
      } catch (error) {
        sessionList.innerHTML = '<p>Fehler beim Laden der Sessions.</p>';
        console.error('Fehler beim Laden der Sessions:', error);
      }
    }

    // NEUE Funktion für effizientes Löschen aller zugehörigen Daten
    async function deleteSessionWithRelatedData(sessionId) {
      try {
        // 1. Finde alle Feedbacks für diese Session
        const feedbackQuery = {
          selector: { 
            type: 'feedback',
            sessionId: sessionId 
          }
        };
        
        const feedbackResponse = await fetch('http://localhost:5984/gmci/_find', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify(feedbackQuery)
        });
        
        const feedbackData = await feedbackResponse.json();
        
        // 2. Finde alle Chat-Nachrichten für diese Session
        const chatQuery = {
          selector: { 
            type: 'chat',
            sessionId: sessionId 
          }
        };
        
        const chatResponse = await fetch('http://localhost:5984/gmci/_find', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify(chatQuery)
        });
        
        const chatData = await chatResponse.json();
        
        // 3. Sammle alle IDs zum Löschen (Session + Feedbacks + Chats)
        const idsToDelete = [
          sessionId, // Die Session selbst
          ...(feedbackData.docs || []).map(doc => doc._id),
          ...(chatData.docs || []).map(doc => doc._id)
        ];
        
        // 4. Lösche alle Dokumente mit ihren Revisionen
        const deletePromises = idsToDelete.map(async (id) => {
          try {
            const docResponse = await fetch(`http://localhost:5984/gmci/${encodeURIComponent(id)}`);
            const doc = await docResponse.json();
            
            if (doc._rev) {
              const deleteResponse = await fetch(
                `http://localhost:5984/gmci/${encodeURIComponent(id)}?rev=${doc._rev}`,
                { method: 'DELETE' }
              );
              if (!deleteResponse.ok) {
                throw new Error(`Fehler beim Löschen von ${id}`);
              }
            }
          } catch (e) {
            console.warn(`Konnte ${id} nicht löschen:`, e.message);
          }
        });
        
        await Promise.all(deletePromises);
        
        console.log(`Session ${sessionId} und alle zugehörigen Daten gelöscht`);
        
      } catch (error) {
        console.error('Fehler beim Löschen der Session mit zugehörigen Daten:', error);
        throw error;
      }
    }

    window.addEventListener('load', loadSessions);
  </script>
</body>
</html>
